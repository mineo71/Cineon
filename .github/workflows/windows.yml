name: windows

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "Cineon/Resources/Scripts/**"
      - "Cineon/Resources/Filters/**"
      - "fixtures/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Core tests
        run: dotnet test --project Cineon.Core.Tests

      - name: Build the app
        run: dotnet build Cineon.App -c Debug -r win-x64 -v minimal

      - name: Launch and screenshot each screen
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Resolution: $($_.Exception.Message)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force ../artifacts | Out-Null
          $exe = Resolve-Path "Cineon.App/bin/Debug/net10.0-windows10.0.19041.0/win-x64/Cineon.exe"
          $failed = $false
          $shots = @('home:dark', 'library:dark', 'timeline:dark', 'downloads:dark', 'together:dark', 'profile:dark', 'rate:dark', 'settings:dark', 'home:light', 'settings:light')
          foreach ($shot in $shots) {
            $route, $theme = $shot.Split(':')
            $data = Join-Path $env:RUNNER_TEMP "cineon-$route-$theme"
            New-Item -ItemType Directory -Force $data | Out-Null
            $env:CINEON_DATA_DIR = $data
            $env:CINEON_ROUTE = $route
            $env:CINEON_THEME = $theme
            $p = Start-Process $exe -PassThru
            Start-Sleep -Seconds 12
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("../artifacts/$route-$theme.png")
            if ($p.HasExited) {
              $failed = $true
              Write-Host "::error::Cineon exited on $shot with code $($p.ExitCode)"
              if (Test-Path "$data/crash.log") { Get-Content "$data/crash.log" }
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-2) } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in 'Application Error', '.NET Runtime' } | Select-Object -First 3 | ForEach-Object { $_.Message }
            } else {
              Stop-Process -Id $p.Id -Force
              Start-Sleep -Seconds 2
            }
            if (Test-Path "$data/crash.log") { Copy-Item "$data/crash.log" "../artifacts/crash-$route-$theme.log" }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-artifacts
          path: artifacts/
